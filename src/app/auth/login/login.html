<div class="login-container">
  <mat-card class="login-form-card">
    <mat-card-header class="login-header">
      <img src="assets/logoepa.png" alt="EPA Logo" class="login-logo">
      <mat-card-title>PLAT-EPA</mat-card-title>
      <mat-card-subtitle>Plataforma de Apoyo TIC</mat-card-subtitle>
    </mat-card-header>
    
    <mat-card-content>
      <form (ngSubmit)="onLogin()" #loginForm="ngForm">
        <!-- Email -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Correo Electrónico</mat-label>
          <input 
            matInput 
            type="email" 
            [(ngModel)]="credentials.email" 
            name="email" 
            required
            email
            [disabled]="isLoading">
          <mat-icon matPrefix>alternate_email</mat-icon>
        </mat-form-field>

        <!-- Password -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input 
            matInput 
            [type]="hidePassword ? 'password' : 'text'"
            [(ngModel)]="credentials.password" 
            name="password" 
            required
            [disabled]="isLoading">
          <mat-icon matPrefix>lock</mat-icon>
          <button 
            mat-icon-button 
            matSuffix 
            type="button"
            (click)="hidePassword = !hidePassword">
            <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
        </mat-form-field>

        <!-- Olvidé contraseña (alineado a la derecha) -->
        <div class="forgot-password-container">
          <a routerLink="/forgot-password" class="forgot-link">¿Olvidaste tu contraseña?</a>
        </div>

        <!-- Botón Login -->
        <button 
          mat-raised-button 
          color="primary" 
          type="submit"
          class="full-width login-button"
          [disabled]="!loginForm.form.valid || isLoading">
          <mat-spinner 
            *ngIf="isLoading" 
            diameter="24"
            color="accent">
          </mat-spinner>
          <span *ngIf="!isLoading" class="login-button-text">
            <mat-icon>login</mat-icon>
            <span>Iniciar Sesión</span>
          </span>
        </button>
      </form>

      <!-- Link a registro -->
      <div class="register-link">
        <span>¿No tienes cuenta?</span>
        <a routerLink="/register">Regístrate aquí</a>
      </div>
    </mat-card-content>
  </mat-card>
</div>
