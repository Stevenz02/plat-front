<div class="login-container">
  <!-- Lado izquierdo con imagen/logo -->
  <div class="login-left">
    <div class="logo-container">
      <img src="assets/images/logo-epa.png" alt="EPA Logo">
      <h1>PLAT-EPA</h1>
      <p>Plataforma de Apoyo TIC</p>
    </div>
  </div>

  <!-- Lado derecho con formulario -->
  <div class="login-right">
    <mat-card class="login-card">
      <mat-card-header>
        <mat-card-title>Iniciar Sesión</mat-card-title>
        <mat-card-subtitle>Sistema de Gestión de Tickets EPA</mat-card-subtitle>
      </mat-card-header>
      
      <mat-card-content>
        <form (ngSubmit)="onLogin()" #loginForm="ngForm">
          <!-- Email -->
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Correo Electrónico</mat-label>
            <input 
              matInput 
              type="email" 
              [(ngModel)]="email" 
              name="email" 
              required
              email
              placeholder="usuario@epa.gov.co"
              [disabled]="isLoading">
            <mat-icon matPrefix>email</mat-icon>
            <mat-error>Ingrese un email válido</mat-error>
          </mat-form-field>

          <!-- Password -->
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Contraseña</mat-label>
            <input 
              matInput 
              [type]="hidePassword ? 'password' : 'text'"
              [(ngModel)]="password" 
              name="password" 
              required
              minlength="6"
              placeholder="••••••••"
              [disabled]="isLoading">
            <mat-icon matPrefix>lock</mat-icon>
            <button 
              mat-icon-button 
              matSuffix 
              type="button"
              (click)="hidePassword = !hidePassword">
              <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
            </button>
            <mat-error>La contraseña debe tener al menos 6 caracteres</mat-error>
          </mat-form-field>

          <!-- Recordarme -->
          <div class="remember-forgot">
            <mat-checkbox [(ngModel)]="rememberMe" name="rememberMe">
              Recordarme
            </mat-checkbox>
            <a class="forgot-link">¿Olvidaste tu contraseña?</a>
          </div>

          <!-- Botón Login -->
          <button 
            mat-raised-button 
            color="primary" 
            type="submit"
            class="full-width login-button"
            [disabled]="!loginForm.form.valid || isLoading">
            <mat-spinner 
              *ngIf="isLoading" 
              diameter="20" 
              class="spinner-button">
            </mat-spinner>
            <span *ngIf="!isLoading">
              <mat-icon>login</mat-icon>
              Iniciar Sesión
            </span>
          </button>
        </form>

        <!-- Registro opcional -->
        <div class="register-link">
          <span>¿No tienes cuenta?</span>
          <a routerLink="/register">Registrarse</a>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
